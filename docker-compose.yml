 services:
   postgres:
     container_name: ms_pg_sql
     image: postgres
     environment:
       POSTGRES_USER: sergiu
       POSTGRES_PASSWORD: sergiu
       PGDATA: /var/lib/postgresql/data
     volumes:
       - postgres:/var/lib/postgresql/data
     ports:
       - "5432:5432"
     networks:
       - microservices-net

   mail-dev:
     container_name: ms_mail_dev
     image: maildev/maildev
     ports:
       - "1080:1080"
       - "1025:1025"

   mongodb:
     container_name: ms_mongo_db
     image: mongo
     ports:
       - "27017:27017"
     volumes:
       - mongo:/data/db
     environment:
      - MONGO_INITDB_ROOT_USERNAME=sergiu
      - MONGO_INITDB_ROOT_PASSWORD=sergiu
     networks:
      - microservices-net

   mongo-express:
     container_name: ms_mongo_express
     image: mongo-express
     ports:
       - "8081:8081"
     depends_on:
       - mongodb
     environment:
       - ME_CONFIG_MONGODB_ADMINUSERNAME=sergiu
       - ME_CONFIG_MONGODB_ADMINPASSWORD=password
       - ME_CONFIG_BASICAUTH_USERNAME=sergiuExpress
       - ME_CONFIG_BASICAUTH_PASSWORD=password
       - ME_CONFIG_MONGODB_URL=mongodb://sergiu:sergiu@mongodb:27017/
     networks:
       - microservices-net

 networks:
  microservices-net:
    driver: bridge

 volumes:
  postgres:
  mongo: